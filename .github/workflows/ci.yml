name: CI

on:
  pull_request:
  push:
    branches-ignore: [ master ]

jobs:
  # Same tools and tasks as the git hooks: scripts/install-tools.sh + Taskfile.yml
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, mysqli, gd, ftp, xml, zip
          tools: composer
          coverage: none

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Dev tools
        run: scripts/install-tools.sh

      - name: Database and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-server podman podman-compose
          sudo scripts/vsp-db-start
          composer install --no-interaction --no-progress

      - name: Everything (verify, tests, imports, variants, compose stack, audit)
        run: task ci

  # Does the devcontainer build, and does the toolchain in it work?
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: task verify
