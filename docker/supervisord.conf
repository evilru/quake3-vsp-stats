[supervisord]
nodaemon = true
# prevent double logging
logfile = /dev/null
logfile_maxbytes = 0
loglevel = info
# runs as www-data: keep runtime files out of root-owned directories
pidfile = /tmp/supervisord.pid

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

# [inet_http_server]
# port = 9001
# Basic auth username
# username = user
# Basic auth password
# password = pass

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php]
command = docker-php-entrypoint apache2-foreground
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stdout_logfile_backups = 0
stderr_logfile_backups = 0
autostart = true
autorestart = true
priority = 10

# imports the log on start and then every IMPORT_INTERVAL seconds (replaces cron, which needs root)
[program:importer]
command = /vsp/docker/import-loop.sh
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stdout_logfile_backups = 0
stderr_logfile_backups = 0
autostart = true
autorestart = true
priority = 20
