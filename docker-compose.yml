services:
  db:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200
    # The database is only reachable from the web service (internal network, no published ports).
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    image: evilru/quake3-vsp-stats:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - backend
    volumes:
      # - /path/to/your/games.log:/vsp/games.log
      # - /path/to/your/server.gif:/vsp/pub/images/server.gif
      # - /path/to/your/logo.gif:/vsp/pub/images/logo.gif
      - logdata:/vsp/logdata
    ports:
      - 80:8080
    # the container runs as the unprivileged user www-data and does not need to write to its image
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2:mode=1777
      - /var/lock/apache2:mode=1777
      - /vsp/ftplogs:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    environment:
      TZ: Europe/Berlin
      # needs to be at least 6 characters long
      # VSP_WEB_PASSWORD:
      # use the same value as for MARIADB_DATABASE
      DB_NAME: ${DB_NAME}
      # use the same value as for MARIADB_USER
      DB_USERNAME: ${DB_USERNAME}
      # use the same value as for MARIADB_PASSWORD
      DB_PASSWORD: ${DB_PASSWORD}
networks:
  default:
  backend:
    internal: true
volumes:
  dbdata:
  logdata:
